name: Fetch WC 2026 Data

on:
  workflow_dispatch: # schedule disabled — re-add cron when WC 2026 starts

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch from football-data.org and cache to Gist
        env:
          FD_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
        run: |
          # Fetch all three endpoints server-side (no CORS restriction)
          # Write directly to temp files to avoid "argument list too long" with large responses
          curl -sf -H "X-Auth-Token: $FD_TOKEN" \
            "https://api.football-data.org/v4/competitions/WC/teams?season=2026" \
            > /tmp/wc-teams.json
          sleep 7

          curl -sf -H "X-Auth-Token: $FD_TOKEN" \
            "https://api.football-data.org/v4/competitions/WC/matches?season=2026" \
            > /tmp/wc-matches.json
          sleep 7

          curl -sf -H "X-Auth-Token: $FD_TOKEN" \
            "https://api.football-data.org/v4/competitions/WC/standings?season=2026" \
            > /tmp/wc-standings.json

          # Combine — use --slurpfile (reads JSON from disk, no arg-length limit)
          jq -n \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile teams     /tmp/wc-teams.json \
            --slurpfile matches   /tmp/wc-matches.json \
            --slurpfile standings /tmp/wc-standings.json \
            '{updatedAt: $updatedAt, teams: $teams[0], matches: $matches[0], standings: $standings[0]}' \
            > /tmp/wc2026-data.json

          # Patch Gist — use --rawfile so the file content is the string value
          jq -n --rawfile content /tmp/wc2026-data.json \
            '{files: {"wc2026-data.json": {content: $content}}}' \
          | curl -sf -X PATCH "https://api.github.com/gists/$GIST_ID" \
              -H "Authorization: token $GIST_PAT" \
              -H "Content-Type: application/json" \
              -d @-

          echo "Done — data cached at $(date -u)"
