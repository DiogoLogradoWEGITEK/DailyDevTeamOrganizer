name: Fetch WC 2026 Data

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC = 14:00 WEST (Portugal summer) — 1 h before the 15:00 meeting
  workflow_dispatch: # allow manual trigger

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch from football-data.org and cache to Gist
        env:
          FD_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
        run: |
          # Fetch all three endpoints (server-side = no CORS restriction)
          TEAMS=$(curl -sf -H "X-Auth-Token: $FD_TOKEN" \
            "https://api.football-data.org/v4/competitions/WC/teams?season=2026")
          sleep 7

          MATCHES=$(curl -sf -H "X-Auth-Token: $FD_TOKEN" \
            "https://api.football-data.org/v4/competitions/WC/matches?season=2026")
          sleep 7

          STANDINGS=$(curl -sf -H "X-Auth-Token: $FD_TOKEN" \
            "https://api.football-data.org/v4/competitions/WC/standings?season=2026")

          # Combine into one JSON blob
          COMBINED=$(jq -n \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson teams    "$TEAMS"    \
            --argjson matches  "$MATCHES"  \
            --argjson standings "$STANDINGS" \
            '{updatedAt: $updatedAt, teams: $teams, matches: $matches, standings: $standings}')

          # Push to Gist (jq handles JSON escaping of the content string)
          jq -n --arg content "$COMBINED" \
            '{files: {"wc2026-data.json": {content: $content}}}' \
          | curl -sf -X PATCH "https://api.github.com/gists/$GIST_ID" \
              -H "Authorization: token $GIST_PAT" \
              -H "Content-Type: application/json" \
              -d @-

          echo "Done — data cached at $(date -u)"
