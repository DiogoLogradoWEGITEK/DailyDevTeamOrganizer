name: Fetch PR Data

on:
  schedule:
    - cron: "0 13 * * 1-5" # 13:00 UTC = 14:00 WEST (Portugal summer) — 1 h before the 15:00 standup
  workflow_dispatch: # allow manual trigger

# Required secrets:
#   PARTICIPANT_HANDLES — JSON array of {name, github} objects, e.g.:
#                         [{"name":"Diogo","github":"DiogoHandle"},{"name":"Cleiton","github":"CleitonHandle"}]
#   GH_TOKEN            — PAT with `repo` read scope (to search PRs in private repos)
#   GIST_ID             — Gist ID where results are cached (same Gist as wc2026-data.json)
#   GIST_PAT            — PAT with `gist` write scope

jobs:
  fetch-prs:
    runs-on: ubuntu-latest
    env:
      PARTICIPANT_HANDLES: ${{ secrets.PARTICIPANT_HANDLES }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_PAT: ${{ secrets.GIST_PAT }}
    steps:
      - name: Fetch recent PRs for each participant and cache to Gist
        run: |
          SEVEN_DAYS_AGO=$(date -d '7 days ago' +%Y-%m-%d)
          COUNT=$(echo "$PARTICIPANT_HANDLES" | jq 'length')

          mkdir -p /tmp/prs

          for i in $(seq 0 $((COUNT - 1))); do
            GITHUB=$(echo "$PARTICIPANT_HANDLES" | jq -r ".[$i].github")

            if [ "$GITHUB" = "null" ] || [ -z "$GITHUB" ]; then
              echo "[]" > "/tmp/prs/${i}.json"
              continue
            fi

            # Search PRs authored by this person across both orgs in the last 7 days
            export SEARCH_QUERY="is:pr author:${GITHUB} org:wedigitek org:WECAMPUS-io created:>=${SEVEN_DAYS_AGO}"
            ENCODED=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['SEARCH_QUERY']))")

            curl -sf \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/search/issues?q=${ENCODED}&per_page=3&sort=created&order=desc" \
            | jq '[.items[] | {title: .title, number: .number}]' \
            > "/tmp/prs/${i}.json" || echo "[]" > "/tmp/prs/${i}.json"

            sleep 2 # stay within search rate limit (30 req/min authenticated)
          done

          # Merge all results into {name: [{title, number}], updatedAt: "..."}
          node -e "
            const fs = require('fs');
            const handles = JSON.parse(process.env.PARTICIPANT_HANDLES);
            const result = { updatedAt: new Date().toISOString() };
            handles.forEach((p, i) => {
              try {
                result[p.name] = JSON.parse(fs.readFileSync('/tmp/prs/' + i + '.json', 'utf8'));
              } catch (e) {
                result[p.name] = [];
              }
            });
            fs.writeFileSync('/tmp/pr-data.json', JSON.stringify(result));
          "

          # Patch Gist
          jq -n --rawfile content /tmp/pr-data.json \
            '{files: {"pr-data.json": {content: $content}}}' \
          | curl -sf -X PATCH "https://api.github.com/gists/$GIST_ID" \
              -H "Authorization: token $GIST_PAT" \
              -H "Content-Type: application/json" \
              -d @-

          echo "Done — PR data cached at $(date -u)"
