name: Fetch PR Data

on:
  schedule:
    - cron: "23 5 * * 1-5" # 05:23 UTC — quiet window, well before the 15:00 Portugal standup
  workflow_dispatch: # allow manual trigger

# Required secrets:
#   PARTICIPANTS_JSON   — JSON array of {name, github, role?} objects (shared with deploy.yml)
#                         role is optional: omit or "dev" for developers, "support" for QA/support staff
#                         e.g.: [{"name":"Alice","github":"alice-gh"},{"name":"Bob","github":"bob-gh","role":"support"}]
#   GH_SEARCH_SCOPE     — GitHub search scope, space-separated. Supports orgs and/or repos:
#                         e.g.: "org:my-org" or "org:my-org org:another-org" or "repo:owner/repo1 repo:owner/repo2"
#   GH_TOKEN            — PAT with `repo` read scope (to search PRs in private repos)
#   GIST_ID             — Gist ID where results are cached
#   GIST_PAT            — PAT with `gist` write scope
#
# Support role (future feature — no-op until qa-approved label + Matrix integration are active):
#   When role=="support", queries PRs labelled `qa-approved` that the person commented on.
#   Activate by:
#     1. Creating a `qa-approved` label in your repos
#     2. Having the Matrix app POST to GitHub API (add label + comment) when support approves a task
#     3. Adding "role":"support" to the relevant entries in PARTICIPANTS_JSON secret

jobs:
  fetch-prs:
    runs-on: ubuntu-latest
    env:
      PARTICIPANTS_JSON: ${{ secrets.PARTICIPANTS_JSON }}
      GH_SEARCH_SCOPE: ${{ secrets.GH_SEARCH_SCOPE }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_PAT: ${{ secrets.GIST_PAT }}
    steps:
      - name: Fetch recent PRs for each participant and cache to Gist
        run: |
          FOURTEEN_DAYS_AGO=$(date -d '14 days ago' +%Y-%m-%d)
          COUNT=$(echo "$PARTICIPANTS_JSON" | jq 'length')

          mkdir -p /tmp/prs

          for i in $(seq 0 $((COUNT - 1))); do
            GITHUB=$(echo "$PARTICIPANTS_JSON" | jq -r ".[$i].github")
            ROLE=$(echo "$PARTICIPANTS_JSON" | jq -r ".[$i].role // \"dev\"")

            if [ "$GITHUB" = "null" ] || [ -z "$GITHUB" ]; then
              echo "[]" > "/tmp/prs/${i}.json"
              continue
            fi

            if [ "$ROLE" = "support" ]; then
              # Support staff: PRs they commented on that have the qa-approved label
              # No-op until qa-approved label exists and Matrix integration is active
              SEARCH_QUERY="is:pr label:qa-approved commenter:${GITHUB} ${GH_SEARCH_SCOPE} updated:>=${FOURTEEN_DAYS_AGO}"
            else
              # Developers: PRs they authored and merged
              SEARCH_QUERY="is:pr is:merged author:${GITHUB} ${GH_SEARCH_SCOPE} merged:>=${FOURTEEN_DAYS_AGO}"
            fi
            GRAPHQL_QUERY='query($q:String!){search(query:$q,type:ISSUE,first:3){nodes{...on PullRequest{title number repository{name} body headRefName baseRefName}}}}'

            curl -sf \
              -H "Authorization: bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST "https://api.github.com/graphql" \
              -d "$(jq -nc --arg q "$SEARCH_QUERY" --arg gql "$GRAPHQL_QUERY" '{query:$gql,variables:{q:$q}}')" \
            | jq '[(.data.search.nodes//[])[]|select(.title!=null)|{title,number,repo:.repository.name,body:(.body//""|gsub("[*#`_~]";"")|gsub("[\r\n]+";" ")|gsub("  +";" ")|ltrimstr(" ")|.[0:200]),branch:.headRefName,baseBranch:.baseRefName}]' \
            > "/tmp/prs/${i}.json" || echo "[]" > "/tmp/prs/${i}.json"

            sleep 2 # stay within search rate limit (30 req/min authenticated)
          done

          # Merge all results into {name: [{title, number}], updatedAt: "...", _roles: {...}}
          node -e "
            const fs = require('fs');
            const handles = JSON.parse(process.env.PARTICIPANTS_JSON);
            const result = { updatedAt: new Date().toISOString(), _roles: {} };
            handles.forEach((p, i) => {
              if (p.role === 'support') result._roles[p.name] = 'support';
              try {
                result[p.name] = JSON.parse(fs.readFileSync('/tmp/prs/' + i + '.json', 'utf8'));
              } catch (e) {
                result[p.name] = [];
              }
            });
            fs.writeFileSync('/tmp/pr-data.json', JSON.stringify(result));
          "

          # Patch Gist
          jq -n --rawfile content /tmp/pr-data.json \
            '{files: {"pr-data.json": {content: $content}}}' \
          | curl -sf -X PATCH "https://api.github.com/gists/$GIST_ID" \
              -H "Authorization: token $GIST_PAT" \
              -H "Content-Type: application/json" \
              -d @-

          echo "Done — PR data cached at $(date -u)"

      - name: PR Fetch Summary
        run: |
          echo "──────────────────────────────────────────"
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/tmp/pr-data.json', 'utf8'));
            Object.entries(data).forEach(([key, val]) => {
              if (key === 'updatedAt') return;
              if (!val.length) {
                console.log('  ' + key + ': (no PRs this week)');
              } else {
                console.log('  ' + key + ':');
                val.forEach(pr => console.log('    [' + pr.repo + ' #' + pr.number + '] ' + pr.title));
              }
            });
          "
          echo "──────────────────────────────────────────"
