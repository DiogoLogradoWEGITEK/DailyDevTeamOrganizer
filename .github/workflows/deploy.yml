name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write participants
        # PARTICIPANTS_JSON accepts any of:
        #   - strict JSON:            [{"name":"Alice","github":"alice-gh"}]
        #   - JS-style (as in participants.js): [{ name: "Alice", github: "alice-gh" }]
        #   - the whole participants.js content incl. comments and window.PARTICIPANTS = ...;
        # It is normalized to strict JSON by scripts/normalize-participants.js before writing.
        env:
          PARTICIPANTS_JSON: ${{ secrets.PARTICIPANTS_JSON }}
        run: |
          if [ -n "$PARTICIPANTS_JSON" ]; then
            NORMALIZED=$(printf '%s' "$PARTICIPANTS_JSON" | node "${GITHUB_WORKSPACE}/scripts/normalize-participants.js")
            printf 'window.PARTICIPANTS = %s;\n' "$NORMALIZED" > participants.js
            echo "participants.js written from secret."
          else
            echo "PARTICIPANTS_JSON secret not set — example data will be used as fallback."
          fi

      - name: Write config
        # Optional secrets — branding.
        # PRIMARY_COLOR: hex colour e.g. #0c3ff7
        # LOGO_URL:      URL or relative path to logo image
        # FAVICON_URL:   URL or relative path to favicon
        # GIST_ID:       GitHub Gist ID that stores PR data
        # GIST_PAT:      GitHub PAT with gist scope
        env:
          PRIMARY_COLOR: ${{ secrets.PRIMARY_COLOR }}
          LOGO_URL: ${{ secrets.LOGO_URL }}
          FAVICON_URL: ${{ secrets.FAVICON_URL }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
        run: |
          printf 'window.CONFIG = { primaryColor: "%s", logoUrl: "%s", faviconUrl: "%s", gistId: "%s", gistPat: "%s" };\n' \
            "${PRIMARY_COLOR:-#0c3ff7}" \
            "${LOGO_URL:-./assets/wedigitek.png}" \
            "${FAVICON_URL:-./assets/favicon.ico}" \
            "${GIST_ID}" "${GIST_PAT}" > config.js
          echo "config.js written."

      - name: Inject version
        run: |
          VERSION="$(git rev-parse --short HEAD)"
          sed -i "s/__VERSION__/${VERSION}/g" index.html
          echo "Version set to ${VERSION}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
