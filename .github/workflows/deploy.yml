name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write participants
        # PARTICIPANTS_JSON must be a JSON array string, e.g.: ["Alice","Bob","Carol"]
        # Set it in: Settings → Secrets and variables → Actions → New repository secret
        env:
          PARTICIPANTS_JSON: ${{ secrets.PARTICIPANTS_JSON }}
        run: |
          if [ -n "$PARTICIPANTS_JSON" ]; then
            printf 'window.PARTICIPANTS = %s;\n' "$PARTICIPANTS_JSON" > participants.js
            echo "participants.js written from secret."
          else
            echo "PARTICIPANTS_JSON secret not set — example data will be used as fallback."
          fi

      - name: Write config
        # Optional secrets — branding + WC2026 betting feature.
        # PRIMARY_COLOR:        hex colour e.g. #0c3ff7
        # LOGO_URL:             URL or relative path to logo image
        # FAVICON_URL:          URL or relative path to favicon
        # GIST_ID:              GitHub Gist ID that stores WC2026 predictions (wc2026-bets.json)
        # GIST_PAT:             GitHub PAT with gist scope — lets every team member save picks
        # FOOTBALL_DATA_TOKEN:  football-data.org free-tier API token for live standings
        env:
          PRIMARY_COLOR: ${{ secrets.PRIMARY_COLOR }}
          LOGO_URL: ${{ secrets.LOGO_URL }}
          FAVICON_URL: ${{ secrets.FAVICON_URL }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          printf 'window.CONFIG = { primaryColor: "%s", logoUrl: "%s", faviconUrl: "%s", gistId: "%s", gistPat: "%s", footballDataToken: "%s" };\n' \
            "${PRIMARY_COLOR:-#0c3ff7}" \
            "${LOGO_URL:-./assets/wedigitek.png}" \
            "${FAVICON_URL:-./assets/favicon.ico}" \
            "${GIST_ID}" "${GIST_PAT}" "${FOOTBALL_DATA_TOKEN}" > config.js
          echo "config.js written."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
