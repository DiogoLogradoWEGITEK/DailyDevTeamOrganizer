<!DOCTYPE html>
<html>
<head>
  <title>Daily Dev</title>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" id="favicon">
  <script src="config.js"></script>
  <script src="config.example.js"></script>
  <script>
    (function () {
      var cfg = window.CONFIG || {};
      var hex = (cfg.primaryColor || '#0c3ff7').replace(/^#/, '');
      var r = parseInt(hex.slice(0, 2), 16);
      var g = parseInt(hex.slice(2, 4), 16);
      var b = parseInt(hex.slice(4, 6), 16);
      function mix(c, t, a) { return Math.round(c + (t - c) * a); }
      function toHex(r, g, b) { return '#' + [r, g, b].map(function (v) { return v.toString(16).padStart(2, '0'); }).join(''); }
      var root = document.documentElement;
      root.style.setProperty('--cp',      '#' + hex);
      root.style.setProperty('--cp-r',    r);
      root.style.setProperty('--cp-g',    g);
      root.style.setProperty('--cp-b',    b);
      root.style.setProperty('--cp-dark', toHex(mix(r, 0, 0.30), mix(g, 0, 0.30), mix(b, 0, 0.30)));
      root.style.setProperty('--cp-bg',   toHex(mix(r, 255, 0.94), mix(g, 255, 0.94), mix(b, 255, 0.94)));
      root.style.setProperty('--cp-hov',  toHex(mix(r, 255, 0.82), mix(g, 255, 0.82), mix(b, 255, 0.82)));
      if (cfg.faviconUrl) document.getElementById('favicon').href = cfg.faviconUrl;
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--cp-bg);
      text-align: center;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 60vw;
      height: 60vw;
      top: -20vw;
      left: -15vw;
      background: radial-gradient(circle, rgb(var(--cp-r) var(--cp-g) var(--cp-b) / 0.18) 0%, transparent 70%);
      filter: blur(40px);
    }

    body::after {
      width: 50vw;
      height: 50vw;
      bottom: -15vw;
      right: -10vw;
      background: radial-gradient(circle, rgb(var(--cp-r) var(--cp-g) var(--cp-b) / 0.13) 0%, transparent 70%);
      filter: blur(50px);
    }

    .blob-mid {
      position: fixed;
      width: 35vw;
      height: 35vw;
      top: 50%;
      left: 60%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgb(var(--cp-r) var(--cp-g) var(--cp-b) / 0.08) 0%, transparent 70%);
      filter: blur(35px);
      pointer-events: none;
      z-index: 0;
    }

    .timer, button, ul {
      position: relative;
      z-index: 1;
    }

    .timer {
      font-size: 4vh;
      font-weight: bold;
      margin-bottom: 2vh;
    }

    button {
      font-size: 2.5vh;
      padding: 1vh 2vh;
      margin-bottom: 2vh;
      cursor: pointer;
      border: 2px solid var(--cp);
      background: var(--cp);
      color: white;
      border-radius: 6px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    button:hover {
      background: var(--cp-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgb(var(--cp-r) var(--cp-g) var(--cp-b) / 0.45);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 3.5vh;
    }

    li {
      position: relative;
      z-index: 4;
      margin: 1.2vh 0;
      padding: 1.2vh 2vh;
      background: #ffffff;
      border-radius: 10px;
      cursor: grab;
      border: none;
      border-left: 5px solid var(--cp);
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #222;
      transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
    }

    li:hover {
      background: var(--cp-hov);
      box-shadow: 0 6px 20px rgb(var(--cp-r) var(--cp-g) var(--cp-b) / 0.32);
      transform: translateX(4px);
    }

    li.dragging {
      opacity: 0.5;
    }

    .top-left-link {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1000;
      height: 32px;
      width: auto;
    }
    @media (max-width: 1330px) { .code-bubble { display: none !important; } }
    .code-bubble {
      position: fixed;
      right: 80px;
      top: 50%;
      transform: translateY(-50%) translateX(24px);
      z-index: 1;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 14px 18px 18px;
      box-shadow: 0 8px 36px rgba(0,0,0,0.38);
      width: 380px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .code-bubble.visible {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
      pointer-events: auto;
    }
    .vsc-chrome {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }
    .vsc-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .vsc-dot.r { background: #ff5f57; }
    .vsc-dot.y { background: #febc2e; }
    .vsc-dot.g { background: #28c840; }
    .vsc-tab {
      margin-left: 8px;
      color: #8b8b8b;
      font-size: 0.72rem;
      font-family: 'Consolas', monospace;
    }
    .code-block {
      margin: 0;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.65;
      color: #d4d4d4;
      background: none;
      border: none;
      padding: 0;
      white-space: pre;
      text-align: left;
    }
    .hl-cm { color: #6a9955; }
    .hl-kw { color: #569cd6; }
    .hl-fn { color: #dcdcaa; }
    .hl-pm { color: #9cdcfe; }
    .hl-va { color: #9cdcfe; }
    .hl-pp { color: #9cdcfe; }
    .hl-nu { color: #b5cea8; }
    .hl-mt { color: #4ec9b0; }

    /* ── PR branch overlay ────────────────────────────────────────────────── */
    @keyframes pr-card-in {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .pr-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .pr-branch-card {
      position: absolute;
      width: 320px;
      padding: 12px 14px 10px;
      background: #fff;
      border-radius: 10px;
      border-left: 4px solid var(--cp);
      box-shadow: 0 4px 18px rgba(0,0,0,0.13);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .pr-branch-card .pr-repo {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--cp);
      text-transform: lowercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
      letter-spacing: 0.02em;
    }
    .pr-branch-card .pr-title {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #222;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pr-branch-card .pr-num {
      font-size: 0.78rem;
      font-weight: 700;
      color: rgb(var(--cp-r) var(--cp-g) var(--cp-b) / 0.5);
      margin-right: 4px;
    }
    .pr-branch-card .pr-branch-ref {
      display: block;
      font-size: 0.68rem;
      font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace;
      color: #aaa;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pr-branch-card .pr-branch-arrow { margin: 0 4px; color: #ccc; }
    .pr-branch-card .pr-body {
      margin-top: 8px;
      font-size: 0.72rem;
      font-weight: 400;
      color: #666;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: normal;
    }
    /* QA / Support card variant */
    .pr-branch-card--qa { border-left-color: #059669; }
    .pr-branch-card--qa::before {
      content: 'QA';
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #059669;
      background: rgba(5,150,105,0.08);
      border: 1px solid rgba(5,150,105,0.25);
      border-radius: 4px;
      padding: 1px 6px;
      text-transform: uppercase;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .pr-branch-card--qa .pr-repo         { color: #059669; }
    .pr-branch-card--qa .pr-num          { color: rgba(5,150,105,0.5); }
    .pr-branch-card--qa .pr-branch-ref   { color: rgba(5,150,105,0.5); }
    .pr-branch-card--qa .pr-branch-arrow { color: rgba(5,150,105,0.3); }
    .pr-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

  </style>
</head>
<body>

  <div class="blob-mid"></div>
  <img src="./assets/wedigitek.png" alt="Logo" class="top-left-link" id="logo">
<div class="timer" id="timer">00:00</div>

  <button id="startBtn" onclick="startSession()"></button>
  <ul id="nameList" style="display:none;"></ul>

  <div class="code-bubble" id="codeBubble">
    <div class="vsc-chrome">
      <span class="vsc-dot r"></span>
      <span class="vsc-dot y"></span>
      <span class="vsc-dot g"></span>
      <span class="vsc-tab">shuffle.js</span>
    </div>
    <pre class="code-block"><code><span class="hl-cm">// Fisher-Yates (Knuth) Shuffle</span>
<span class="hl-cm">// not rigged</span>
<span class="hl-kw">function</span> <span class="hl-fn">shuffle</span>(<span class="hl-pm">array</span>) {
  <span class="hl-kw">for</span> (<span class="hl-kw">let</span> <span class="hl-va">i</span> = <span class="hl-pm">array</span>.<span class="hl-pp">length</span> - <span class="hl-nu">1</span>; <span class="hl-va">i</span> &gt; <span class="hl-nu">0</span>; <span class="hl-va">i</span>--) {
    <span class="hl-kw">const</span> <span class="hl-va">j</span> = <span class="hl-mt">Math</span>.<span class="hl-fn">floor</span>(<span class="hl-mt">Math</span>.<span class="hl-fn">random</span>() * (<span class="hl-va">i</span> + <span class="hl-nu">1</span>));
    [<span class="hl-pm">array</span>[<span class="hl-va">i</span>], <span class="hl-pm">array</span>[<span class="hl-va">j</span>]] = [<span class="hl-pm">array</span>[<span class="hl-va">j</span>], <span class="hl-pm">array</span>[<span class="hl-va">i</span>]];
  }
}</code></pre>
  </div>

  <script src="participants.js"></script>
  <script src="participants.example.js"></script>
  <script src="pr-data.example.js"></script>
  <script>
    const TRANSLATIONS = {
      en: { startBtn: 'Presentation Order', reroll: 'Reroll' },
      pt: { startBtn: 'Ordem de Apresentação', reroll: 'Reembaralhar' }
    };
    const lang = navigator.language && navigator.language.startsWith('pt') ? 'pt' : 'en';
    const t = TRANSLATIONS[lang];

    // Apply logo URL from config
    const logoEl = document.getElementById('logo');
    if (window.CONFIG && window.CONFIG.logoUrl) logoEl.src = window.CONFIG.logoUrl;

    document.getElementById('startBtn').textContent = t.startBtn;

    const participants = (window.PARTICIPANTS || []).map(p =>
      typeof p === 'string' ? { name: p, github: null } : p
    );
    const names = participants.map(p => p.name);
    const participantByName = Object.fromEntries(participants.map(p => [p.name, p]));
    let prData = null;
    window.__prData = () => prData; // debug helper

    const listEl = document.getElementById("nameList");

    let seconds = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) return;

      timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        document.getElementById("timer").textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      seconds = 0;
      document.getElementById("timer").textContent = "00:00";
    }

    let prHoverTimer = null;
    function displayNames(arr) {
      listEl.innerHTML = "";
      arr.forEach((name) => {
        const li = document.createElement("li");
        li.textContent = name;
        li.setAttribute("draggable", "true");
        addDragAndDropHandlers(li);
        li.addEventListener('mouseenter', () => {
          prHoverTimer = setTimeout(() => showPRBranches(li, name), 150);
        });
        li.addEventListener('mouseleave', () => {
          clearTimeout(prHoverTimer);
          hidePRBranches();
        });
        listEl.appendChild(li);
      });
    }

    function addDragAndDropHandlers(item) {
      item.addEventListener("dragstart", () => {
        item.classList.add("dragging");
        hidePRBranches();
      });

      item.addEventListener("dragend", () => {
        item.classList.remove("dragging");
        updateArrayFromDOM();
      });

      item.addEventListener("dragover", (e) => {
        e.preventDefault();
        const dragging = document.querySelector(".dragging");
        if (!dragging || dragging === item) return;

        const rect = item.getBoundingClientRect();
        const offset = e.clientY - rect.top;

        if (offset > rect.height / 2) {
          item.after(dragging);
        } else {
          item.before(dragging);
        }
      });
    }

    function updateArrayFromDOM() {
      const items = document.querySelectorAll("#nameList li");
      names.length = 0;
      items.forEach(li => names.push(li.textContent));
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // Kick off PR data fetch in background immediately — ready before first hover
    loadPRData();

    async function startSession() {
      shuffle(names);
      displayNames(names);
      listEl.style.display = "block";
      startTimer();
      document.getElementById("startBtn").textContent = t.reroll;
      document.getElementById("codeBubble").classList.add("visible");
    }

    async function loadPRData() {
      const gistId = (window.CONFIG || {}).gistId;
      if (!gistId || gistId === 'YOUR_GIST_ID') {
        if (window.PR_DATA_EXAMPLE) { prData = window.PR_DATA_EXAMPLE; console.log('[PR] using example data', Object.keys(prData)); }
        return;
      }
      try {
        const r = await fetch(`https://api.github.com/gists/${gistId}`);
        if (!r.ok) return;
        const gist = await r.json();
        const file = gist.files['pr-data.json'];
        if (file) { prData = JSON.parse(file.content); console.log('[PR] data loaded', Object.keys(prData)); }
      } catch (e) { console.warn('[PR] loadPRData failed', e); }
    }

    function hidePRBranches() {
      document.getElementById('prOverlay')?.remove();
      document.getElementById('prOverlaySvg')?.remove();
    }

    function showPRBranches(li, name) {
      hidePRBranches();
      const prs = prData && prData[name];
      if (!prs || !prs.length) return;
      const displayPrs = prs.slice(0, 3);
      const rect = li.getBoundingClientRect();
      const liCY = rect.top + rect.height / 2;
      const cardW = 320;
      const cardRight = rect.left - 72;
      const cardGap = 10;
      const isSupport = ((prData._roles || {})[name]) === 'support';
      const color = getComputedStyle(document.documentElement).getPropertyValue('--cp').trim();

      // SVG layer for branch lines
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'pr-lines');
      const svgLayer = document.createElement('div');
      svgLayer.id = 'prOverlaySvg';
      svgLayer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2;';
      svgLayer.appendChild(svg);
      document.body.appendChild(svgLayer);

      // Card overlay
      const overlay = document.createElement('div');
      overlay.className = 'pr-overlay';
      overlay.id = 'prOverlay';
      document.body.appendChild(overlay);

      // Create cards hidden for measurement
      const cards = displayPrs.map((pr) => {
        const card = document.createElement('div');
        card.className = 'pr-branch-card' + (isSupport ? ' pr-branch-card--qa' : '');
        card.style.cssText = `left:${cardRight - cardW}px; top:0; visibility:hidden;`;
        card.innerHTML =
          `<span class="pr-repo">${escapeHtml(pr.repo || '')}</span>` +
          (pr.branch ? `<span class="pr-branch-ref">${escapeHtml(pr.branch)}<span class="pr-branch-arrow">→</span>${escapeHtml(pr.baseBranch || 'main')}</span>` : '') +
          `<span class="pr-title"><span class="pr-num">#${pr.number}</span>${escapeHtml(pr.title)}</span>` +
          (pr.body ? `<div class="pr-body">${escapeHtml(pr.body)}</div>` : '');
        overlay.appendChild(card);
        return card;
      });

      // Measure, position, then animate
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const heights = cards.map(c => c.offsetHeight);
          const totalH = heights.reduce((s, h) => s + h, 0) + cardGap * (cards.length - 1);
          let y = liCY - totalH / 2;

          cards.forEach((card, idx) => {
            const h = heights[idx];
            const cardCY = y + h / 2;
            card.style.top = `${y}px`;
            card.style.visibility = '';
            card.style.animation = `pr-card-in 0.15s ease ${0.18 + idx * 0.07}s both`;

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', rect.left); line.setAttribute('y1', liCY);
            line.setAttribute('x2', cardRight);  line.setAttribute('y2', cardCY);
            const lineLen = Math.hypot(rect.left - cardRight, liCY - cardCY);
            line.setAttribute('stroke', color); line.setAttribute('stroke-width', '1.5');
            line.style.strokeDasharray = lineLen;
            line.style.strokeDashoffset = lineLen;
            svg.appendChild(line);

            setTimeout(() => {
              requestAnimationFrame(() => {
                line.style.transition = 'stroke-dashoffset 0.18s ease-out';
                line.style.strokeDashoffset = 0;
              });
            }, idx * 70);

            y += h + cardGap;
          });
        });
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

  </script>

  <div style="position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:0.65rem;opacity:0.35;font-family:monospace;pointer-events:none;z-index:9999">__VERSION__</div>

</body>
</html>
