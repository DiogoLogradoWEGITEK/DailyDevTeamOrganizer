<!DOCTYPE html>
<html lang="en">
<head>
  <title>Daily Dev</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Internal team tool: keep it out of search engines and AI crawlers -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" id="favicon">
  <script src="config.js"></script>
  <script src="config.example.js"></script>
  <script>
    (function () {
      var cfg = window.CONFIG || {};
      var hex = (cfg.primaryColor || '#0c3ff7').replace(/^#/, '');
      var r = parseInt(hex.slice(0, 2), 16);
      var g = parseInt(hex.slice(2, 4), 16);
      var b = parseInt(hex.slice(4, 6), 16);
      function mix(c, t, a) { return Math.round(c + (t - c) * a); }
      function toHex(r, g, b) { return '#' + [r, g, b].map(function (v) { return v.toString(16).padStart(2, '0'); }).join(''); }
      var root = document.documentElement;
      root.style.setProperty('--cp',      '#' + hex);
      root.style.setProperty('--cp-r',    r);
      root.style.setProperty('--cp-g',    g);
      root.style.setProperty('--cp-b',    b);
      root.style.setProperty('--cp-dark', toHex(mix(r, 0, 0.30), mix(g, 0, 0.30), mix(b, 0, 0.30)));
      root.style.setProperty('--cp-bg',   toHex(mix(r, 255, 0.94), mix(g, 255, 0.94), mix(b, 255, 0.94)));
      root.style.setProperty('--cp-hov',  toHex(mix(r, 255, 0.82), mix(g, 255, 0.82), mix(b, 255, 0.82)));
      if (cfg.faviconUrl) document.getElementById('favicon').href = cfg.faviconUrl;
    })();
  </script>
  <style>
    :root {
      --ink: #1b2130;
      --ink-soft: #2c3445;
      --muted: #6b7385;
      --line: #e3e7ef;
      --surface: #ffffff;
      --chip: #f2f4f8;
      --qa: #059669;
      --qa-bg: #e3f4ee;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      background: var(--cp-bg);
      overflow: hidden;
    }

    button { font: inherit; }

    /* Whole app fits the window: top bar + (order | speaker) below it */
    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    /* ── Top bar: logo · timer · roll ─────────────────────────────────────── */
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 1.3vh 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .logo {
      justify-self: start;
      height: clamp(22px, 3.2vh, 34px);
      width: auto;
    }

    .timer {
      font-size: clamp(26px, 4.6vh, 48px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    body:not(.started) .timer { color: var(--muted); opacity: 0.45; }

    .roll-btn {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      font-size: clamp(14px, 2vh, 19px);
      font-weight: 600;
      padding: 0.6em 1.1em;
      border: 0;
      border-radius: 10px;
      background: var(--cp);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .roll-btn:hover {
      background: var(--cp-dark);
      box-shadow: 0 4px 14px rgb(var(--cp-r) var(--cp-g) var(--cp-b) / 0.35);
    }

    .roll-btn:focus-visible {
      outline: 3px solid rgb(var(--cp-r) var(--cp-g) var(--cp-b) / 0.35);
      outline-offset: 2px;
    }

    .roll-btn svg { width: 1.1em; height: 1.1em; flex: none; }

    .main {
      display: grid;
      grid-template-columns: clamp(220px, 19vw, 340px) minmax(0, 1fr);
      min-height: 0;
    }

    /* ── Order (left) ─────────────────────────────────────────────────────── */
    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 2vh 14px 12px;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }

    .people {
      list-style: none;
      margin: 0;
      padding: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .people-empty {
      flex: 1 1 auto;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 1vh 12px;
      border-radius: 10px;
      font-size: clamp(16px, 2.5vh, 26px);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s, color 0.12s;
    }

    .person:hover { background: var(--cp-bg); }
    .person:focus { outline: none; }
    .person:focus-visible { outline: 2px solid var(--cp); outline-offset: -2px; }

    .person .pos {
      flex: none;
      display: grid;
      place-items: center;
      width: 1.75em;
      height: 1.75em;
      border-radius: 50%;
      font-size: 0.62em;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: var(--cp-bg);
      color: var(--cp);
    }

    .person .label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Already spoke: fades back so the remaining people stand out */
    .person.done { color: var(--muted); }
    .person.done .pos { background: transparent; color: var(--muted); }

    .person.selected { background: var(--cp); color: #fff; }
    .person.selected .pos { background: rgb(255 255 255 / 0.22); color: #fff; }

    /* QA / Support members keep a green identity */
    .person.qa .pos { background: var(--qa-bg); color: var(--qa); }
    .person.qa:hover { background: var(--qa-bg); }
    .person.qa.selected { background: var(--qa); color: #fff; }
    .person.qa.selected .pos { background: rgb(255 255 255 / 0.22); color: #fff; }

    .person.dragging { opacity: 0.4; }

    .sidebar-foot {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }

    .version { font-family: ui-monospace, Consolas, monospace; opacity: 0.6; }

    /* ── Speaker (right) ──────────────────────────────────────────────────── */
    .stage {
      min-height: 0;
      overflow-y: auto;
      padding: 3.5vh 3vw;
      display: flex;
      flex-direction: column;
    }

    /* margin-block:auto centres short content but still scrolls from the top
       when a long PR doesn't fit (justify-content:center would clip it). */
    .stage-inner { --fit: 1; margin-block: auto; width: 100%; }

    .stage-empty {
      margin: auto;
      max-width: 32ch;
      text-align: center;
      color: var(--muted);
      font-size: clamp(18px, 3vh, 30px);
      font-weight: 600;
      line-height: 1.4;
    }

    .speaker {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: calc(2.4vh * var(--fit));
    }

    .speaker-name {
      margin: 0;
      font-size: calc(clamp(28px, 5.2vh, 60px) * var(--fit));
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .speaker-pos {
      font-size: calc(clamp(13px, 1.8vh, 19px) * var(--fit));
      font-weight: 600;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .badge {
      font-size: calc(clamp(11px, 1.5vh, 15px) * var(--fit));
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.25em 0.6em;
      border-radius: 6px;
      background: var(--qa-bg);
      color: var(--qa);
    }

    .no-prs {
      margin: 0;
      color: var(--muted);
      font-size: calc(clamp(16px, 2.4vh, 24px) * var(--fit));
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    .pr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: calc(2vh * var(--fit)) 1.4vw;
      align-items: start;
    }

    /* A lone PR shouldn't stretch into one very long line */
    .pr-grid.single { max-width: 980px; }

    .pr-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 4px solid var(--cp);
      border-radius: var(--radius);
      padding: calc(2vh * var(--fit)) calc(1.4vw * var(--fit) + 8px);
      box-shadow: 0 1px 2px rgb(16 24 40 / 0.04), 0 4px 16px rgb(16 24 40 / 0.06);
      animation: card-in 0.18s ease both;
    }

    .pr-card.qa { border-top-color: var(--qa); }

    .pr-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 2px 10px;
      font-size: calc(clamp(12px, 1.6vh, 17px) * var(--fit));
    }

    .pr-repo { font-weight: 700; color: var(--cp); }
    .pr-card.qa .pr-repo { color: var(--qa); }
    .pr-num { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

    .pr-title {
      margin: 0.35em 0 0.5em;
      font-size: calc(clamp(17px, 2.5vh, 28px) * var(--fit));
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .pr-branch {
      display: inline-block;
      max-width: 100%;
      padding: 0.2em 0.55em;
      border-radius: 6px;
      background: var(--chip);
      color: var(--muted);
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
      font-size: calc(clamp(11px, 1.45vh, 16px) * var(--fit));
      overflow-wrap: anywhere;
    }

    .pr-body {
      margin: 0.85em 0 0;
      font-size: calc(clamp(14px, 2vh, 22px) * var(--fit));
      line-height: 1.55;
      color: var(--ink-soft);
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      .main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); max-height: 38vh; }
      .topbar { padding-inline: 16px; }
      .stage { padding: 20px 16px; }
    }
  </style>
</head>
<body>

  <div class="shell">
    <header class="topbar">
      <img src="./assets/wedigitek.png" alt="Logo" class="logo" id="logo">
      <div class="timer" id="timer" aria-live="off">00:00</div>
      <button class="roll-btn" id="startBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/>
        </svg>
        <span id="startBtnLabel"></span>
      </button>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="people-empty" id="peopleEmpty"></div>
        <ol class="people" id="nameList" hidden></ol>
        <div class="sidebar-foot">
          <span id="hint"></span>
          <span id="dataAge"></span>
          <span class="version">__VERSION__</span>
        </div>
      </aside>

      <main class="stage" id="stage"></main>
    </div>
  </div>

  <script src="participants.js"></script>
  <script src="participants.example.js"></script>
  <script src="pr-data.example.js"></script>
  <script>
    const TRANSLATIONS = {
      en: {
        startBtn: 'Presentation Order',
        reroll: 'Reroll',
        intro: 'Press “Presentation Order” to shuffle today’s order',
        orderHere: 'The order shows up here',
        click: 'Click a name to show their work',
        noPRs: 'nothing to show for now',
        hint: 'Click a name · ↑/↓ to switch · Esc to clear · drag to reorder',
        updated: 'PRs fetched {t}',
        noData: 'PR data unavailable'
      },
      pt: {
        startBtn: 'Ordem de Apresentação',
        reroll: 'Reembaralhar',
        intro: 'Carregue em “Ordem de Apresentação” para baralhar a ordem de hoje',
        orderHere: 'A ordem aparece aqui',
        click: 'Clique num nome para ver o trabalho',
        noPRs: 'nada para mostrar por agora',
        hint: 'Clique num nome · ↑/↓ para trocar · Esc limpa · arraste para reordenar',
        updated: 'PRs obtidos {t}',
        noData: 'Dados de PRs indisponíveis'
      }
    };
    const lang = navigator.language && navigator.language.startsWith('pt') ? 'pt' : 'en';
    const t = TRANSLATIONS[lang];
    document.documentElement.lang = lang;

    const cfg = window.CONFIG || {};
    if (cfg.logoUrl) document.getElementById('logo').src = cfg.logoUrl;

    const startBtn = document.getElementById('startBtn');
    const startBtnLabel = document.getElementById('startBtnLabel');
    const timerEl = document.getElementById('timer');
    const listEl = document.getElementById('nameList');
    const peopleEmptyEl = document.getElementById('peopleEmpty');
    const stageEl = document.getElementById('stage');
    const dataAgeEl = document.getElementById('dataAge');

    startBtnLabel.textContent = t.startBtn;
    peopleEmptyEl.textContent = t.orderHere;
    document.getElementById('hint').textContent = t.hint;

    // Local preview (no Gist configured): always show the example members with
    // the example PR data — never real names without matching PRs.
    const localPreview = !cfg.gistId || cfg.gistId === 'YOUR_GIST_ID';
    const sourceList = localPreview && window.PARTICIPANTS_EXAMPLE
      ? window.PARTICIPANTS_EXAMPLE
      : (window.PARTICIPANTS || []);
    const participants = sourceList.map(p =>
      typeof p === 'string' ? { name: p, github: null } : p
    );
    const names = participants.map(p => p.name);
    const participantByName = Object.fromEntries(participants.map(p => [p.name, p]));

    let prData = null;
    window.__prData = () => prData; // debug helper

    function isQA(name) {
      return ((prData && prData._roles) || {})[name] === 'support' ||
        (participantByName[name] || {}).role === 'support';
    }

    // The Gist keeps the full PR text and the page shows all of it.
    // CONFIG.prBodyMaxChars > 0 brings back a display cap if ever needed.
    const PR_BODY_MAX_CHARS = Number.isInteger(cfg.prBodyMaxChars) && cfg.prBodyMaxChars >= 0
      ? cfg.prBodyMaxChars
      : 0;
    function clampText(text, max) {
      const s = String(text).trim();
      if (!max || s.length <= max) return s;
      const cut = s.slice(0, max);
      const lastSpace = cut.lastIndexOf(' ');
      // Prefer a word boundary unless that throws away too much text.
      const kept = lastSpace > max * 0.7 ? cut.slice(0, lastSpace) : cut;
      return kept.replace(/[\s.,;:·\-–—]+$/, '') + '…';
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Timer ────────────────────────────────────────────────────────────────
    let seconds = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    // ── Order list ───────────────────────────────────────────────────────────
    let started = false;
    let selectedIdx = -1;
    const spoken = new Set(); // people who already had their turn this round
    let hoverTimer = null;

    function renderList() {
      listEl.innerHTML = '';
      names.forEach((name, i) => {
        const li = document.createElement('li');
        li.className = 'person';
        li.tabIndex = 0;
        li.draggable = true;
        li.dataset.name = name;
        li.innerHTML = `<span class="pos">${i + 1}</span><span class="label">${escapeHtml(name)}</span>`;
        li.addEventListener('mouseenter', () => {
          clearTimeout(hoverTimer);
          hoverTimer = setTimeout(() => showSpeaker(name), 150);
        });
        li.addEventListener('mouseleave', () => {
          clearTimeout(hoverTimer);
          restoreSelection();
        });
        addDragAndDropHandlers(li);
        listEl.appendChild(li);
      });
      refreshListState();
    }

    // Classes and position numbers follow the current DOM order
    function refreshListState() {
      Array.from(listEl.children).forEach((li, i) => {
        const name = li.dataset.name;
        li.querySelector('.pos').textContent = i + 1;
        li.classList.toggle('qa', isQA(name));
        li.classList.toggle('selected', i === selectedIdx);
        li.classList.toggle('done', i !== selectedIdx && spoken.has(name));
      });
    }

    function selectParticipant(i) {
      const items = listEl.children;
      if (i < 0 || i >= items.length) return;
      if (selectedIdx >= 0 && items[selectedIdx]) spoken.add(items[selectedIdx].dataset.name);
      if (selectedIdx === i) {
        selectedIdx = -1;
      } else {
        selectedIdx = i;
        spoken.delete(items[i].dataset.name);
        items[i].focus({ preventScroll: true });
        items[i].scrollIntoView({ block: 'nearest' });
      }
      refreshListState();
      restoreSelection();
    }

    function clearSelection() {
      if (selectedIdx < 0) return;
      selectParticipant(selectedIdx);
    }

    function moveSelection(dir) {
      const count = listEl.children.length;
      if (!count) return;
      let i = selectedIdx < 0 ? (dir > 0 ? 0 : count - 1) : selectedIdx + dir;
      if (i < 0) i = count - 1;
      if (i >= count) i = 0;
      selectParticipant(i);
    }

    function restoreSelection() {
      const li = listEl.children[selectedIdx];
      if (li) showSpeaker(li.dataset.name);
      else showMessage(started ? t.click : t.intro);
    }

    // Listeners are attached once; the <li>s are rebuilt on every reroll
    listEl.addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (li) selectParticipant(Array.prototype.indexOf.call(listEl.children, li));
    });

    listEl.addEventListener('keydown', (e) => {
      const li = e.target.closest('li');
      if (li && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        selectParticipant(Array.prototype.indexOf.call(listEl.children, li));
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!started) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1); }
      else if (e.key === 'Escape') clearSelection();
    });

    function addDragAndDropHandlers(item) {
      item.addEventListener('dragstart', () => {
        clearTimeout(hoverTimer);
        item.classList.add('dragging');
      });

      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        const selectedName = listEl.children[selectedIdx] && names[selectedIdx];
        names.length = 0;
        Array.from(listEl.children).forEach(li => names.push(li.dataset.name));
        selectedIdx = selectedName ? names.indexOf(selectedName) : -1;
        refreshListState();
        restoreSelection();
      });

      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        const dragging = listEl.querySelector('.dragging');
        if (!dragging || dragging === item) return;
        const rect = item.getBoundingClientRect();
        if (e.clientY - rect.top > rect.height / 2) item.after(dragging);
        else item.before(dragging);
      });
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    startBtn.addEventListener('click', () => {
      started = true;
      document.body.classList.add('started');
      selectedIdx = -1;
      spoken.clear();
      shuffle(names);
      renderList();
      listEl.hidden = false;
      peopleEmptyEl.hidden = true;
      startBtnLabel.textContent = t.reroll;
      startTimer();
      restoreSelection();
    });

    // ── Speaker stage ────────────────────────────────────────────────────────
    let stageName = null; // guards against no-op re-renders (flicker)

    function showMessage(text) {
      stageName = null;
      stageEl.innerHTML = `<div class="stage-empty">${escapeHtml(text)}</div>`;
    }

    function showSpeaker(name) {
      if (stageName === name) return;
      stageName = name;

      const qa = isQA(name);
      const prs = (prData && prData[name]) || [];
      const pos = names.indexOf(name) + 1;

      let html = '<div class="stage-inner"><div class="speaker">' +
        `<h1 class="speaker-name">${escapeHtml(name)}</h1>` +
        (qa ? '<span class="badge">QA</span>' : '') +
        (pos > 0 ? `<span class="speaker-pos">${pos} / ${names.length}</span>` : '') +
        '</div>';

      if (!prs.length) {
        html += `<p class="no-prs">${escapeHtml(t.noPRs)}</p>`;
      } else {
        html += `<div class="pr-grid${prs.length === 1 ? ' single' : ''}">`;
        prs.forEach((pr, idx) => {
          html +=
            `<article class="pr-card${qa ? ' qa' : ''}" style="animation-delay:${idx * 0.06}s">` +
              '<div class="pr-meta">' +
                `<span class="pr-repo">${escapeHtml(pr.repo || '')}</span>` +
                `<span class="pr-num">#${escapeHtml(pr.number)}</span>` +
              '</div>' +
              `<h2 class="pr-title">${escapeHtml(pr.title || '')}</h2>` +
              (pr.branch ? `<span class="pr-branch">${escapeHtml(pr.branch)} → ${escapeHtml(pr.baseBranch || 'main')}</span>` : '') +
              (pr.body ? `<p class="pr-body">${escapeHtml(clampText(pr.body, PR_BODY_MAX_CHARS))}</p>` : '') +
            '</article>';
        });
        html += '</div>';
      }
      html += '</div>';

      stageEl.innerHTML = html;
      stageEl.scrollTop = 0;
      fitStage();
    }

    // Pick the largest font multiplier (FIT_MIN..FIT_MAX) whose layout fits
    // the stage: short PRs read bigger on a shared screen, long ones shrink a
    // little. Anything still too tall at FIT_MIN scrolls instead of clipping.
    const FIT_MIN = 0.85;
    const FIT_MAX = 1.5;
    const FIT_FILL = 0.96;
    function fitStage() {
      const inner = stageEl.querySelector('.stage-inner');
      if (!inner) return;
      const cs = getComputedStyle(stageEl);
      const maxH = (stageEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)) * FIT_FILL;
      if (maxH <= 0) return;
      const fits = (f) => {
        inner.style.setProperty('--fit', f);
        return inner.offsetHeight <= maxH;
      };
      if (fits(FIT_MAX)) return;
      if (!fits(FIT_MIN)) return;
      let lo = FIT_MIN, hi = FIT_MAX;
      for (let i = 0; i < 7; i++) {
        const mid = (lo + hi) / 2;
        if (fits(mid)) lo = mid; else hi = mid;
      }
      inner.style.setProperty('--fit', lo.toFixed(3));
    }

    let fitFrame = 0;
    window.addEventListener('resize', () => {
      cancelAnimationFrame(fitFrame);
      fitFrame = requestAnimationFrame(fitStage);
    });

    // ── PR data ──────────────────────────────────────────────────────────────
    function showDataAge() {
      const at = prData && Date.parse(prData.updatedAt);
      if (!at) { dataAgeEl.textContent = prData ? '' : t.noData; return; }
      const mins = Math.round((Date.now() - at) / 60000);
      const rtf = new Intl.RelativeTimeFormat(lang, { numeric: 'auto' });
      const ago = mins < 60 ? rtf.format(-mins, 'minute')
        : mins < 48 * 60 ? rtf.format(-Math.round(mins / 60), 'hour')
        : rtf.format(-Math.round(mins / 1440), 'day');
      dataAgeEl.textContent = t.updated.replace('{t}', ago);
    }

    async function loadPRData() {
      const gistId = cfg.gistId;
      if (localPreview) {
        if (window.PR_DATA_EXAMPLE) prData = window.PR_DATA_EXAMPLE;
      } else {
        const urls = [];
        if (cfg.gistUser) urls.push(`https://gist.githubusercontent.com/${cfg.gistUser}/${gistId}/raw/pr-data.json`);
        urls.push(`https://api.github.com/gists/${gistId}`);
        for (const url of urls) {
          try {
            const r = await fetch(url);
            if (!r.ok) continue;
            if (url.includes('/raw/')) {
              prData = await r.json();
            } else {
              const file = (await r.json()).files['pr-data.json'];
              if (file) prData = JSON.parse(file.content);
            }
            if (prData) break;
          } catch (e) { console.warn('[PR] loadPRData failed', url, e); }
        }
      }
      showDataAge();
      // Data may arrive after someone was already picked: redraw with it
      if (started) {
        refreshListState();
        stageName = null;
        restoreSelection();
      }
    }

    showMessage(t.intro);
    loadPRData();
  </script>

</body>
</html>
